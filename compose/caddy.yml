name: mediastack-caddy

services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - /opt/mediastack/conf/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/media/caddy/data:/data
      - /opt/media/caddy/config:/config

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    networks:
      - mediastack_proxy

networks:
  mediastack_proxy:
    external: true
