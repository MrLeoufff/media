apiVersion: mediastack/v1
name: portainer
displayName: Portainer
version: "1.0.0"
description: Gestionnaire Docker
category: administration
homepage: https://www.portainer.io

container:
  name: portainer
  image: portainer/portainer-ce:latest

network:
  name: mediastack_proxy

ports:
  - 9000
  - 9443

health:
  protocol: https
  port: 9443
  path: /api/status

dependencies:
  - caddy

storage:
  - /var/run/docker.sock
  - /opt/media/portainer/data

proxy:
  enabled: false

scripts:
  doctor: doctor.sh

features:
  doctor: true
  install: true
  uninstall: true
  upgrade: false
  backup: false
  restore: false

enabledByDefault: true
