name: mediastack-portainer

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/media/portainer/data:/data

    # Image minimaliste (pas de shell/curl/wget) : pas de healthcheck Docker.
    networks:
      - mediastack_proxy

networks:
  mediastack_proxy:
    external: true
