name: mediastack-homepage

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped

    environment:
      HOMEPAGE_ALLOWED_HOSTS: "192.168.1.69,localhost,media"

    volumes:
      - /opt/media/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - mediastack_proxy

networks:
  mediastack_proxy:
    external: true
