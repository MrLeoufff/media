name: mediastack-jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped

    volumes:
      - /opt/media/jellyfin/config:/config
      - /opt/media/jellyfin/cache:/cache
      - /opt/media:/media

    devices:
      - /dev/dri:/dev/dri

    group_add:
      - "44"
      - "992"

    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8096/health >/dev/null 2>&1 || wget -q -O /dev/null http://127.0.0.1:8096/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - mediastack_proxy

networks:
  mediastack_proxy:
    external: true
